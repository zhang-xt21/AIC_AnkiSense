name: Offline checks

on:
  push:
    branches: [main, Final-clean]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      AI_MODE: demo
      AI_API_KEY: ""
      AI_BASE_URL: ""
      AI_MODEL: ""
      ANKISENSE_DATA_DIR: .local/ci-data
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Prepare Python environment
        shell: pwsh
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pip install -r requirements.lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Python tests (Anki runtime remains optional)
        run: .\.venv\Scripts\python.exe -m pytest -q -rs
      - name: Install UI test dependencies
        run: npm ci
      - name: Frontend unit tests
        run: npm test
      - name: Install test browser
        run: npx playwright install chromium
      - name: Offline browser checks
        run: npm run test:browser
