<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <a class="brand" href="/" aria-label="AnkiSense 首页"><span class="brand-symbol">a<span>·</span></span><span>Anki<span class="brand-light">Sense</span></span></a>
      <p class="sidebar-label">学习工作台</p>
      <nav id="navigation">
        <button class="nav-item" data-view="cards"><span class="nav-icon" aria-hidden="true">▱</span>卡牌结果</button>
        <button class="nav-item active" data-view="materials"><span class="nav-icon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v18H6.5A2.5 2.5 0 0 1 4 18.5Zm0 13A2.5 2.5 0 0 1 6.5 16H20M8 7h8M8 10h6"/></svg></span>学习材料</button>
        <button class="nav-item" data-view="review"><span class="nav-icon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="15" height="15" rx="3"/><path d="M16 3H6a3 3 0 0 0-3 3v10m7-3 2 2 5-5"/></svg></span>制卡工作台</button>
        <button class="nav-item" data-view="practice"><span class="nav-icon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="m16 8 4-4"/></svg></span>开始练习</button>
        <button class="nav-item" data-view="export"><span class="nav-icon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m-4-4 4 4 4-4M4 16v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg></span>导出至 Anki</button>
      </nav>
      <button class="nav-item settings-navigation" data-view="settings"><span class="nav-icon" aria-hidden="true">⚙</span>模型设置</button>
    </aside>
    <div class="workspace">
      <header class="topbar"><span id="app-version" class="helper"></span><div id="mode-status" class="mode-badge">正在连接本地服务…</div></header>
      <main id="main" tabindex="-1"><div class="loading-state">正在载入学习空间…</div></main>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <noscript>请启用 JavaScript 以使用 AnkiSense 学习工作台。</noscript>
</body>
</html>
